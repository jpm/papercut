[tool.pytest.ini_options]
testpaths = ["tests"]
# the modules import each other as top-level modules (import settings, ...)
pythonpath = ["."]
markers = [
    "integration: needs the Docker test databases (see docs/integration-testing-plan.md)",
]
addopts = "-m 'not integration'"
filterwarnings = [
    # expected: the standard-nntplib / standard-crypt backports announce themselves
    "ignore:(nntplib|crypt) was removed in Python 3.13:DeprecationWarning",
]
