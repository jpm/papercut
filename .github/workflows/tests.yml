name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # the DB drivers and nntplib are replaced by fakes, so they aren't needed
      - run: python -m pytest --cov=. --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.13'
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: integration tests (MySQL 8.4, PostgreSQL 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the integration tests against real databases
        run: docker compose -f docker-compose.test.yml run --rm papercut
      - name: Database logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs mysql postgres
      - name: Stop the databases
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
