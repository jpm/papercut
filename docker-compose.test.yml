# Docker integration tests: see docs/integration-testing-plan.md
#
#   docker compose -f docker-compose.test.yml run --rm papercut
#
# (add --profile mysql57 to also test against MySQL 5.7)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: papercut
    volumes:
      - ./tests/fixtures/sql/mysql:/docker-entrypoint-initdb.d:ro
      - ./storage:/papercut-storage:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppapercut"]
      interval: 2s
      timeout: 5s
      retries: 60

  mysql57:
    profiles: [mysql57]
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: papercut
    volumes:
      - ./tests/fixtures/sql/mysql:/docker-entrypoint-initdb.d:ro
      - ./storage:/papercut-storage:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppapercut"]
      interval: 2s
      timeout: 5s
      retries: 90

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: papercut
    volumes:
      - ./tests/fixtures/sql/postgres:/docker-entrypoint-initdb.d:ro
      - ./storage:/papercut-storage:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 60

  papercut:
    build:
      context: .
      dockerfile: tests/docker/Dockerfile
    volumes:
      - .:/src
    environment:
      PAPERCUT_TEST_MYSQL_HOSTS: mysql
      PAPERCUT_TEST_POSTGRES_HOST: postgres
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-m", "integration", "-p", "no:cacheprovider", "-v"]
